# Experiment Settings
experiment_name: "stage2_baseline"
device: "cuda"
seed: 42

# Data Settings
data:
  data_root: "/home/ruisi/mesh_compression/data/official"
  processed_dir: "/mnt/Lab/yeruisi/data/compression/dataset_preload"  # 预处理数据存放位置
  point_num: 320000       # Encoder 输入的点云数量
  batch_size: 1
  num_workers: 16
  base_mesh_verts_min: 1000
  base_mesh_verts_max: 3000

# Model Settings
model:
  feature_dim: 128        # Vertex Feature Dimension
  enc_hidden_dim: 64      # Encoder MLP Hidden Dim
  dec_hidden_dim: 64      # Decoder MLP Hidden Dim
  subdivision_levels: 8   # Positional Encoding Levels
  subdivision_rate: 4     # NGF Subdivision Rate (每条边细分段数)

# Training Settings
train:
  epochs: 200
  lr: 1.0e-5
  weight_decay: 1.0e-4
  save_interval: 10       # Epochs
  log_interval: 10        # Steps
  
# Loss Weights
loss:
  w_render: 1.0           # Normal Consistency Loss
  w_laplacian: 0.01       # Mesh Smoothness
  w_disp: 0.001           # Displacement L2 Regularization

# Renderer Settings
render:
  image_size: 512
  views_per_sample: 64     # 每个样本随机渲染的视角数
  dist_multiplier: 1.5


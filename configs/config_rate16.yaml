data:
  base_mesh_faces_max: 3000
  base_mesh_faces_min: 1000
  batch_size: 1
  data_root: /home/ruisi/mesh_compression/data/official
  lmdb_path: /mnt/Lab/yeruisi/data/compression/train_data.lmdb
  num_workers: 2
  point_num: 819200
  preload_ram: false
  preprocessed_base_mesh_dir: /mnt/Lab/yeruisi/data/compression/base_mesh_preload
  processed_dir: /mnt/Lab/yeruisi/data/compression/dataset_preload
  simplification_backend: pyfqmr
  use_preprocess_base_mesh: true
device: cuda
enable_attention_diagnostics: true
experiment_name: stage2_baseline_sumoffeature_mode2_n
loss:
  use_chamfer: false
  vae_beta: 0.001
  vae_warmup_epochs: 50
  w_chamfer: 100.0
  w_depth_l1: 10.0
  w_disp: 0.0
  w_laplacian: 0.0
  w_mat: 0.001
  w_normal_l1: 4.0
  w_normal_ssim: 0.5
  w_render: 1.0
model:
  attention_temperature: 1.5
  dec_hidden_dim: 256
  decoder_type: sum_of_feature
  enc_hidden_dim: 256
  encoder_type: attentive
  feature_dim: 512
  init_mode: near_zero
  num_attention_heads: 4
  posenc_mode: 2
  predict_offset: false
  score_clip_value: 5.0
  score_init_scale: 0.4
  subdivision_levels: 8
  subdivision_rate: 16
  use_feature_transform: false
  use_max_pool_residual: false
  use_scan_normal: true
  use_vae: false
  vae_latent_dim: 128
render:
  dist_multiplier: 0.5
  image_size: 512
  use_mixed_views: false
  views_per_sample: 2
seed: 42
train:
  epochs: 500
  log_interval: 10
  lr: 0.0005
  save_interval: 3
  weight_decay: 1.0e-05

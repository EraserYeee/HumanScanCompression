data:
  base_mesh_faces_max: 3500
  base_mesh_faces_min: 2000
  batch_size: 1
  data_root: /home/ruisi/mesh_compression/data/official
  lmdb_path: /mnt/lab/data/yeruisi/data/compression/datalmdb/train.lmdb
  num_workers: 2
  persistent_workers: false   # 避免 worker 常驻导致内存累计
  pin_memory: false           # 内存紧张时更稳
  prefetch_factor: 1
  point_num: 819200
  preload_ram: false
  preprocessed_base_mesh_dir: /mnt/lab/data/yeruisi/data/compression/base_mesh_preload2
  processed_dir: /mnt/lab/data/yeruisi/data/compression/dataset_preload2
  simplification_backend: pyfqmr
  use_preprocess_base_mesh: true
  sharp_edge_sampling: true         # 启用 sharp edge biased sampling
  sharp_edge_angle_threshold: 10.0   # 二面角阈值 (度)
  sharp_edge_ratio: 0.5              # sharp 点占总采样点的比例
  sharp_cache_size: 64               # per-worker LRU cache；0 表示关闭
device: cuda
experiment_name: stage2_ptsa_attentive_facecoding_autoknn
loss:
  use_chamfer: false
  w_chamfer: 100.0
  w_disp: 0.0
  w_laplacian: 0.0
  w_mat: 0.001
  w_seam: 10.0                # seam consistency: 相邻面共享边位移主动一致, 治 sliver
  w_render: 1.0
  normal_loss_type: geo
  w_depth_l1: 4.0
  w_mask: 1.0
  w_normal_geo: 4.0
  w_normal_l1: 4.0
  w_normal_ssim: 0.5
  vae_beta: 0.001
  vae_warmup_epochs: 0
model:
  # --- Encoding mode ---
  encoding_mode: face          # 'vertex' (default) or 'face' (triangle coordinate system)
  face_ortho_frame: true       # true: orthonormal {e1_hat, e2_perp, n} frame for displacement false: raw parametric {e1, e2, n} frame (needs strong encoder)
  face_stitch_grad_compensate: true   # seam scatter_mean 反向按共享点数放大梯度（方案 A）

  # --- Grouper ---
  grouper_type: auto_knn      # 'scan_knn' (original) or 'vertex_knn'
  auto_knn_min_pts: 16
  vertex_knn_k: 512             # points per vertex neighbourhood
  vertex_knn_chunk_size: 512

  # --- Encoder (PT Self-Attention) ---
  # 'pt_sa_attentive' (SA + attention pooling) or 'pt_sa_max' (SA + max pooling)
  encoder_type: pt_sa_attentive
  enc_hidden_dim: [64]          # light MLP before SA (fewer layers than original)
  pt_sa_dim: 128                # self-attention hidden dimension
  pt_sa_num_heads: 4
  pt_sa_num_layers: 1
  pt_sa_use_ffn: true
  pt_sa_pe_frequencies: 4       # sinusoidal PE frequency bands

  # --- Shared model settings ---
  feature_dim: 512
  use_scan_normal: true
  use_feature_transform: false
  predict_offset: false
  posenc_mode: 2
  init_mode: near_zero

  # --- Decoder ---
  decoder_type: sum_of_feature
  dec_hidden_dim: [512, 256, 128, 64]
  subdivision_levels: 8
  subdivision_rate: 14

  # --- VAE (disabled) ---
  use_vae: false
  vae_latent_dim: 40
render:
  dist_multiplier: 0.4
  image_size: 512
  use_mixed_views: false
  views_per_sample: 8
  view_chunk_size: 2
  # 方案 C：几何感知视点（FPS on base mesh face centroids + 少量随机全局视点）
  use_geometry_aware: false
  geo_fps_ratio: 0.67          # FPS 视点占比，剩余为随机全局视点
  global_dist_multiplier: 1.0  # 随机全局视点距 mesh 中心的距离
seed: 42
enable_attention_diagnostics: false
train:
  epochs: 700
  log_interval: 10
  lr: 5.0e-04
  save_interval: 3
  weight_decay: 1.0e-05
  profile_timing: false
  profile_timing_interval: 50

# Joint Stage 1 + Stage 2 training configuration
# Phase 1: Pre-train Stage 1 with geometric losses only
# Phase 2: Pre-train Stage 2 with Stage 1 base meshes (Stage 1 frozen)
# Phase 3: Joint fine-tuning of both stages

data:
  batch_size: 1
  data_root: /home/ruisi/mesh_compression/data/official
  lmdb_path: /mnt/lab/data/yeruisi/data/compression/datalmdb/train.lmdb
  num_workers: 2
  point_num: 819200
  preload_ram: false
  processed_dir: /mnt/lab/data/yeruisi/data/compression/dataset_preload2
  simplification_backend: pyfqmr
  # For Phase 2/3 fallback: base mesh range (not normally used with Stage 1)
  base_mesh_faces_min: 1000
  base_mesh_faces_max: 3000
  use_preprocess_base_mesh: false
  # Curvature precomputation for Stage 1 loss
  compute_curvature: true
  curvature_knn: 30
  curvature_subsample: 50000

device: cuda
experiment_name: joint_stage1_stage2
seed: 42

# =================== Stage 1 Config ===================
stage1:
  # Encoder
  encoder_hidden_dims: [64, 128, 256, 512]
  point_feat_dim: 128
  global_feat_dim: 512

  # Seed predictor
  seed_hidden_dim: 256
  seed_local_k: 32
  fps_subsample: 50000
  num_seeds_min: 600
  num_seeds_max: 1500

  # Mesh extraction
  bbox_padding: 0.15
  vote_threshold: 3

  # Loss weights (for Phase 1 and Phase 3 regularization)
  w_chamfer_curv: 3000.0
  w_chamfer_uniform: 100.0
  w_chamfer_backward: 1000.0
  w_chamfer_repulsion: 100.0
  repulsion_clamp: 3.0
  w_normal: 100.0
  w_mesh_reg: 1.0

# =================== Stage 2 Config ===================
# Reuses existing face-anchored config
stage2:
  encoding_mode: face
  face_ortho_frame: false
  grouper_type: vertex_knn
  vertex_knn_k: 512
  vertex_knn_chunk_size: 512

  encoder_type: pt_sa_attentive
  enc_hidden_dim: [64]
  pt_sa_dim: 128
  pt_sa_num_heads: 4
  pt_sa_num_layers: 1
  pt_sa_use_ffn: true
  pt_sa_pe_frequencies: 4

  feature_dim: 768
  use_scan_normal: true
  use_feature_transform: false
  predict_offset: false
  posenc_mode: 2
  init_mode: near_zero

  decoder_type: sum_of_feature
  dec_hidden_dim: [256, 128, 64]
  subdivision_levels: 8
  subdivision_rate: 16
  use_vae: false
  vae_latent_dim: 40

# =================== Rendering Config ===================
render:
  dist_multiplier: 0.4
  image_size: 512
  use_mixed_views: false
  views_per_sample: 6
  view_chunk_size: 2

# =================== Training Config ===================
train:
  # Phase 1: Pre-train Stage 1
  phase1_epochs: 80
  phase1_lr: 1.0e-03
  phase1_weight_decay: 1.0e-05

  # Phase 2: Pre-train Stage 2 (Stage 1 frozen)
  phase2_epochs: 80
  phase2_lr: 5.0e-04
  phase2_weight_decay: 1.0e-05

  # Phase 3: Joint fine-tuning
  phase3_epochs: 300
  phase3_lr_stage1: 1.0e-05
  phase3_lr_stage2: 1.0e-04
  phase3_weight_decay: 1.0e-05
  phase3_lambda_init: 1.0       # Stage 1 regularization weight
  phase3_lambda_final: 0.1      # Decays to this over training

  # Common
  save_interval: 5
  log_interval: 10
  profile_timing: false

# =================== Loss Config (Stage 2) ===================
loss:
  use_chamfer: false
  w_chamfer: 100.0
  w_disp: 0.0
  w_laplacian: 1.0
  w_mat: 0.001
  w_render: 1.0
  normal_loss_type: geo
  w_depth_l1: 4.0
  w_mask: 1.0
  w_normal_geo: 4.0
  w_normal_l1: 4.0
  w_normal_ssim: 0.5
  vae_beta: 0.001
  vae_warmup_epochs: 0
